<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Bible Verses JS</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:linear-gradient(135deg,#0f172a,#1e3a8a);min-height:100vh;color:white;padding:15px}.container{max-width:600px;margin:auto}.card{background:white;color:#0f172a;border-radius:20px;padding:20px;margin:15px 0}.langs{display:flex;gap:8px;justify-content:center}.langs button{padding:8px 16px;border-radius:20px;border:2px solid #1e3a8a;background:white;color:#1e3a8a;font-weight:bold}.langs button.active{background:#1e3a8a;color:white}.verse{font-size:19px;text-align:center;line-height:1.6;min-height:80px}.ref{text-align:center;color:#1e3a8a;font-weight:900;margin:10px 0}.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btns button{padding:10px 14px;border:none;border-radius:10px;font-weight:bold}.b1{background:#1e3a8a;color:white;flex:1}.b2{background:#e0e7ff}.b3{background:#dcfce7}.b4{background:#fef3c7}</style></head><body><div class="container"><h1 style="text-align:center">✝️ Bible Verses JS</h1><p style="text-align:center;opacity:.8">By Kishore | Tamil English Hebrew</p><div class="card"><div class="langs"><button class="active" id="e" onclick="setL('en')">English</button><button id="t" onclick="setL('ta')">தமிழ்</button><button id="h" onclick="setL('he')">עברית</button></div><div class="verse" id="v">Loading...</div><div class="ref" id="r"></div><div class="btns"><button class="b1" onclick="nextV()">NEXT ➡️</button><button class="b2" onclick="copyV()">📋 COPY</button><button class="b3" onclick="shareV()">📤 SHARE</button><button class="b4" onclick="downV()">🖼️ DOWNLOAD</button></div></div><div class="card"><h3>📜 Bible History</h3><p>God created world, Moses saved Israel, David beat Goliath, Jesus born & rose - John 3:16</p></div><div class="card"><h3>🤔 Doubts?</h3><p>Love = God is love 1 John 4:8 | Fear? Isaiah 41:10 | Pray like friend da MG!</p></div></div><canvas id="c" style="display:none"></canvas><script>const verses=[{en:"For God so loved the world",ta:"தேவன் உலகத்தில் அன்புகூர்ந்தார்",he:"אַהֲבָה רַבָּה",ref:"John 3:16"},{en:"The Lord is my shepherd",ta:"கர்த்தர் என் மேய்ப்பர்",he:"יְהוָה רֹעִי",ref:"Psalm 23:1"},{en:"I can do all things through Christ",ta:"கிறிஸ்துவினாலே எல்லாம் முடியும்",he:"הַכֹּל אֶעֱשֶׂה",ref:"Phil 4:13"},{en:"All things work for good",ta:"சகலமும் நன்மைக்கு ஏதுவாகும்",he:"לְטוֹבָה",ref:"Romans 8:28"}];let lang='en',idx=0;function render(){document.getElementById('v').innerText=verses[idx][lang];document.getElementById('r').innerText=verses[idx].ref;document.querySelectorAll('.langs button').forEach(b=>b.classList.remove('active'));document.getElementById(lang=='en'?'e':lang=='ta'?'t':'h').classList.add('active');}function setL(l){lang=l;render();}function nextV(){idx=(idx+1)%verses.length;render();}function copyV(){navigator.clipboard.writeText(verses[idx][lang]+' - '+verses[idx].ref);alert('Copied MG!');}function shareV(){const t=verses[idx][lang]+' - '+verses[idx].ref;if(navigator.share){navigator.share({title:'Bible Verses JS',text:t,url:location.href})}else copyV();}function downV(){const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');canvas.width=1080;canvas.height=1080;ctx.fillStyle='#0f172a';ctx.fillRect(0,0,1080,1080);ctx.fillStyle='white';ctx.font='bold 40px sans-serif';ctx.textAlign='center';ctx.fillText('Bible Verses JS',540,100);ctx.font='28px sans-serif';wrap(ctx,verses[idx][lang],540,200,900,40);ctx.fillStyle='#93c5fd';ctx.fillText(verses[idx].ref,540,950);const a=document.createElement('a');a.download='verse.png';a.href=canvas.toDataURL();a.click();}function wrap(ctx,text,x,y,w,lh){const words=text.split(' ');let line='';let yy=y;for(let n=0;n<words.length;n++){const test=line+words[n]+' ';if(ctx.measureText(test).width>w&&n>0){ctx.fillText(line,x,yy);line=words[n]+' ';yy+=lh;}else line=test;}ctx.fillText(line,x,yy);}render();</script></body></html>
